name: Collect AQI

on:
  schedule:
    - cron: '37 8,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'config.json'
      - 'tests/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect-aqi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test merge and station history rules
        run: python -B -m unittest discover -s tests -v
      - name: Collect all stations
        id: collect
        continue-on-error: true
        run: python -B collect.py
      - name: Save successful station updates
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f last_run.json ]; then
            cp last_run.json status.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m "data: update observations $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Data push failed.' >&2
          exit 1
      - name: Publish run report
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: collection-report-${{ github.run_id }}
          path: last_run.json
          if-no-files-found: warn
          retention-days: 14
      - name: Mark incomplete collection as failed
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: exit 1
